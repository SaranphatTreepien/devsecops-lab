apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-ops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SaranphatTreepien/devsecops-lab
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: forge-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true