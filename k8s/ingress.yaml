apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-ops-ingress
  namespace: forge-ops
spec:
  ingressClassName: nginx
  rules:
    - host: forge-ops.local
      http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80