grafana:
  enabled: false
alertmanager:
  enabled: true
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: "forge-ops-user-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["user-service.forge-ops.svc.cluster.local:80"]
      - job_name: "forge-ops-product-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["product-service.forge-ops.svc.cluster.local:80"]
      - job_name: "forge-ops-order-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["order-service.forge-ops.svc.cluster.local:80"]
