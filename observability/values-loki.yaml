deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1

# ปิด scalable mode ทั้งหมด
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# ปิด cache ที่กิน memory มาก
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false

lokiCanary:
  enabled: false