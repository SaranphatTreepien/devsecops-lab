name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ── Stage 1: Secret Scan ──────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
        with:
          args: detect --source . --no-git

  # ── Stage 2: SAST ─────────────────────────────────
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r services/user-service/ -f json -o bandit-report.json || true
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript"
  # ── Stage 3: Test ─────────────────────────────────
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [sast, codeql]
    steps:
      - uses: actions/checkout@v4

      # ── User Service (Python) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install user-service dependencies
        run: |
          cd services/user-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Test user-service
        run: |
          cd services/user-service
          pytest -v

      # ── Product Service (Node.js) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install product-service dependencies
        run: |
          cd services/product-service
          npm ci

      - name: Test product-service
        run: |
          cd services/product-service
          npm test

      # ── Order Service (Go) ──
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test order-service
        run: |
          cd services/order-service
          go test ./... -v

  # ── Stage 4: Build & Push ─────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}
      - name: Build & Push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/product-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}
      - name: Build & Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}

  # ── Stage 5: Image Scan ───────────────────────────
  trivy:
    name: Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Scan user-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}
          format: sarif
          output: trivy-user.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy Report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-user.sarif

  # ── Stage 6: Deploy ───────────────────────────────
  deploy:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: trivy
    steps:
      - name: Deploy Summary
        run: |
          echo "✅ Pipeline completed successfully"
          echo ""
          echo "📦 Images pushed to DockerHub:"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}"
          echo ""
          echo "🚀 In production, would deploy with:"
          echo "  kubectl set image deployment/order-service order-service=...:${{ github.sha }} -n forge-ops"
          echo "  kubectl set image deployment/product-service product-service=...:${{ github.sha }} -n forge-ops"
          echo "  kubectl set image deployment/user-service user-service=...:${{ github.sha }} -n forge-ops"

  # ── Stage 7: Load Test ────────────────────────────
  load-test:
    name: Load Test (k6 Smoke)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.49.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run k6 Smoke Test
        run: k6 run load-tests/smoke-test.js
        env:
          K6_NO_USAGE_REPORT: true

      - name: Upload k6 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-report
          path: k6-report.json